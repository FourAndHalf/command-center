name: mobile
description: "Personal Command Center — offline-first mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local relational storage (mirrors the eventual Postgres schema)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # IDs, time, JSON
  uuid: ^4.5.1
  intl: ^0.20.2

  # Local (device) notifications for review/tripwire/reflection reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Export / share
  share_plus: ^10.1.4

  # Routing
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
